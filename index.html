<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hockey Stats</title>
<meta name="theme-color" content="#0e2a47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hockey">
<style>
  :root {
    --bg: #0e2a47; --card: #163a5f; --card2: #1d4875; --text: #f2f5f8; --muted: #9db3c8;
    --us: #2bb673; --them: #e5534b; --accent: #ffc400; --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 4px 0 16px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  button { font: inherit; color: inherit; border: 0; border-radius: var(--radius); padding: 14px 16px;
    background: var(--card2); cursor: pointer; touch-action: manipulation; }
  button:active { filter: brightness(1.2); transform: scale(.98); }
  button.primary { background: var(--accent); color: #1a1a1a; font-weight: 700; }
  button.danger { background: transparent; color: var(--them); border: 1px solid var(--them); }
  button.ghost { background: transparent; border: 1px solid var(--card2); }
  button.small { padding: 8px 12px; font-size: 15px; }
  .full { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 15px; }
  input, textarea { width: 100%; font: inherit; padding: 14px; border-radius: var(--radius); border: 1px solid var(--card2);
    background: var(--card); color: var(--text); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.4; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }

  /* Match list */
  .match { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .match .score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px;
    background: var(--accent); color: #1a1a1a; font-weight: 700; margin-left: 6px; vertical-align: middle; }

  /* Live match */
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center;
    background: var(--card); border-radius: var(--radius); padding: 16px 8px; }
  .scoreboard .team { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .scoreboard .num { font-size: 56px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .scoreboard .dash { font-size: 40px; color: var(--muted); padding: 0 6px; }
  .clockbox { text-align: center; margin: 14px 0; }
  .period { font-size: 16px; color: var(--muted); }
  .clock { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .clock.paused { color: var(--muted); }
  .clock.over { color: var(--accent); }
  .goalbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .goalbtns button { padding: 26px 8px; font-size: 20px; font-weight: 800; color: #fff; }
  .goalbtns .us { background: var(--us); }
  .goalbtns .them { background: var(--them); }
  .goalbtns button:disabled { opacity: .35; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--card2); }
  .log li:last-child { border-bottom: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .log .t { font-variant-numeric: tabular-nums; min-width: 92px; }
  .log .who { flex: 1; overflow-wrap: anywhere; }
  .log .x { padding: 4px 10px; background: transparent; color: var(--muted); font-size: 20px; }
  /* Analysis */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 180px; touch-action: pan-y; }
  .chart .axis { fill: var(--muted); font-size: 11px; }
  .chart .grid { stroke: var(--card2); stroke-width: 1; }
  .charttitle { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 6px; }
  .charttitle .muted { font-size: 14px; }
  .tip { position: absolute; top: 0; pointer-events: none; background: #000d; color: #fff; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translateX(-50%); z-index: 2; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button { flex: 1; padding: 10px; font-size: 15px; }
  .seglabel { font-size: 13px; margin: 0 0 4px; }
  .seg button.on { background: var(--accent); color: #1a1a1a; font-weight: 700; }
  .range { position: relative; height: 36px; margin: 6px 4px; }
  .range .track { position: absolute; left: 0; right: 0; top: 16px; height: 4px; border-radius: 2px; background: var(--card2); }
  .range .fill { position: absolute; top: 16px; height: 4px; border-radius: 2px; background: var(--accent); }
  .range input { position: absolute; left: 0; top: 0; width: 100%; height: 36px; margin: 0; background: none;
    pointer-events: none; -webkit-appearance: none; appearance: none; border: 0; padding: 0; }
  .range input::-webkit-slider-runnable-track { background: none; height: 36px; }
  .range input::-moz-range-track { background: none; }
  .range input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 28px; height: 28px;
    margin-top: 4px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); cursor: pointer; }
  .range input::-moz-range-thumb { pointer-events: auto; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--bg); cursor: pointer; }
  .rangelabels { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .rangelabels div:last-child { text-align: right; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: #000c; padding: 10px 18px; border-radius: 99px; font-size: 15px; pointer-events: none;
    transition: opacity .3s; opacity: 0; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <h1>🏒 Hockey Stats</h1>
  <button class="primary full" id="btnNew">+ New match</button>
  <button class="full" id="btnAnalysis" style="margin-top:10px">📊 Analysis</button>
  <h2>Matches</h2>
  <div id="matchList"></div>
  <button class="ghost full" id="btnExport" style="margin-top:16px">Export all as CSV</button>
</section>

<!-- NEW MATCH -->
<section id="setup" class="hidden">
  <div class="topbar"><h1>New match</h1><button class="small ghost" data-go="home">Cancel</button></div>
  <label for="inOurs">Our team</label>
  <input id="inOurs" autocomplete="off" placeholder="Us">
  <label for="inOpp">Opposing team</label>
  <input id="inOpp" autocomplete="off" placeholder="e.g. Furuset">
  <div class="row">
    <div><label for="inPeriods">Periods</label><input id="inPeriods" type="number" inputmode="numeric" min="1" max="9" value="3"></div>
    <div><label for="inMinutes">Minutes each</label><input id="inMinutes" type="number" inputmode="numeric" min="1" max="90" value="15"></div>
  </div>
  <button class="primary full" id="btnCreate" style="margin-top:20px">Create match</button>
</section>

<!-- LIVE / DETAIL -->
<section id="match" class="hidden">
  <div class="topbar">
    <button class="small ghost" data-go="home">‹ Matches</button>
    <span class="muted" id="mDate"></span>
  </div>
  <div class="scoreboard">
    <div><div class="num" id="sUs">0</div><div class="team" id="nUs"></div></div>
    <div class="dash">–</div>
    <div><div class="num" id="sThem">0</div><div class="team" id="nThem"></div></div>
  </div>

  <div id="readyControls">
    <p class="muted" style="text-align:center" id="readyInfo"></p>
    <button class="full" id="btnStart" style="padding:22px;font-size:20px;background:var(--us);color:#fff;font-weight:700">▶ Start match</button>
  </div>

  <div id="liveControls">
    <div class="clockbox">
      <div class="period" id="periodLabel"></div>
      <div class="clock" id="clock">00:00</div>
    </div>
    <div class="goalbtns">
      <button class="us" id="goalUs">GOAL<br><small id="gUsName"></small></button>
      <button class="them" id="goalThem">GOAL<br><small id="gThemName"></small></button>
    </div>
    <div class="row">
      <button id="btnPause">Pause</button>
      <button id="btnPeriod">End P1</button>
    </div>
    <button class="danger full" id="btnEnd" style="margin-top:10px">End match</button>
  </div>

  <h2>Goals</h2>
  <div class="card"><ul class="log" id="goalLog"></ul></div>

  <h2><label for="inNote" style="margin:0;color:inherit;font-size:inherit">Notes</label></h2>
  <textarea id="inNote" placeholder="Anything worth remembering about this match…"></textarea>

  <button class="primary full" id="btnSaveExit" style="margin-top:24px">✓ Save and exit</button>
  <button class="danger full hidden" id="btnDelete" style="margin-top:32px">Delete this match</button>
</section>

<!-- ANALYSIS -->
<section id="analysis" class="hidden">
  <div class="topbar"><h1>Analysis</h1><button class="small ghost" data-go="home">‹ Matches</button></div>
  <p class="muted" id="aSummary" style="margin-top:0"></p>
  <div id="aCharts">
    <div class="seg" id="aMode">
      <button data-mode="interval" class="on">Per interval</button><button data-mode="cum">Cumulative</button>
    </div>
    <div id="binWrap">
      <div class="muted seglabel">Bin size</div>
      <div class="seg" id="binSize">
        <button data-size="1" class="on">1 min</button><button data-size="3">3 min</button><button data-size="5">5 min</button>
      </div>
    </div>
    <div class="card">
      <div class="charttitle"><b>Goals scored</b><span class="muted binLabel">avg per match, per minute</span></div>
      <div class="chart" id="chartUs"></div>
    </div>
    <div class="card">
      <div class="charttitle"><b>Goals conceded</b><span class="muted binLabel">avg per match, per minute</span></div>
      <div class="chart" id="chartThem"></div>
    </div>
    <h2>Matches included</h2>
    <div class="card">
      <div class="range" id="range">
        <div class="track"></div><div class="fill" id="rangeFill"></div>
        <input type="range" id="rFrom" min="0" value="0" step="1" aria-label="First match">
        <input type="range" id="rTo" min="0" value="0" step="1" aria-label="Last match">
      </div>
      <div class="rangelabels"><div id="lFrom"></div><div id="lTo"></div></div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY = "hockeystats.v1";
const $ = (id) => document.getElementById(id);

// ---------- storage ----------
let db = load();
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { matches: [], ourTeam: "" }; }
  catch { return { matches: [], ourTeam: "" }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ---------- time helpers ----------
const pad = (n) => String(n).padStart(2, "0");
function fmt(ms) { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
function localDate(iso) { const d = new Date(iso); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function localTime(iso) { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }

// Time played in the current period: accumulated ms + time since last resume, capped at the period length.
const periodLen = (m) => m.periodMinutes * 60000;
function periodMs(m) { return Math.min(periodLen(m), m.clock.acc + (m.clock.runningSince ? Date.now() - m.clock.runningSince : 0)); }
function matchMs(m) { return m.periodDurations.reduce((a, b) => a + b, 0) + periodMs(m); }
const score = (m, team) => m.goals.filter((g) => g.team === team).length;
const periodName = (m, p) => "P" + p;
const when = (m) => m.startedAt || m.createdAt; // not-yet-started matches use the creation time

// ---------- navigation ----------
let current = null; // match being viewed
let tick = null;
function show(view) {
  for (const id of ["home", "setup", "match", "analysis"]) $(id).classList.toggle("hidden", id !== view);
  clearInterval(tick); tick = null;
  if (view === "home") { current = null; renderHome(); releaseWake(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => show(b.dataset.go)));

// ---------- home ----------
function renderHome() {
  const list = $("matchList");
  list.innerHTML = "";
  const ms = [...db.matches].sort((a, b) => when(b).localeCompare(when(a)));
  if (!ms.length) list.innerHTML = '<p class="muted">No matches yet.</p>';
  for (const m of ms) {
    const el = document.createElement("div");
    el.className = "card match";
    el.innerHTML = `<div><div><b></b>${m.status === "live" ? '<span class="badge">LIVE</span>' : m.status === "ready" ? '<span class="badge">NOT STARTED</span>' : ""}</div>
      <div class="muted">${localDate(when(m))} · ${m.startedAt ? localTime(m.startedAt).slice(0, 5) : "—"}</div></div>
      <div class="score">${score(m, "us")} – ${score(m, "them")}</div>`;
    el.querySelector("b").textContent = "vs " + m.opponent;
    el.addEventListener("click", () => openMatch(m.id));
    list.appendChild(el);
  }
}

$("btnNew").addEventListener("click", () => {
  const live = db.matches.find((m) => m.status === "live");
  if (live && !confirm(`A match vs ${live.opponent} is still running. End it and start a new one?`)) return;
  if (live) endMatch(live);
  $("inOurs").value = db.ourTeam || "";
  $("inOpp").value = "";
  show("setup");
  $("inOpp").focus();
});

$("btnCreate").addEventListener("click", () => {
  const opponent = $("inOpp").value.trim();
  if (!opponent) { $("inOpp").focus(); toast("Enter the opposing team"); return; }
  const ourTeam = $("inOurs").value.trim() || "Us";
  db.ourTeam = ourTeam;
  const now = Date.now();
  const m = {
    id: String(now),
    ourTeam, opponent,
    createdAt: new Date(now).toISOString(),
    startedAt: null,              // set when "Start match" is pressed
    endedAt: null,
    periods: Math.max(1, parseInt($("inPeriods").value, 10) || 3),
    periodMinutes: Math.max(1, parseInt($("inMinutes").value, 10) || 15),
    status: "ready",              // ready -> live -> done
    note: "",
    period: 1,
    periodDurations: [],          // finished periods' lengths in ms
    clock: { acc: 0, runningSince: null },
    between: false,               // true between "End period" and "Start next period"
    goals: [],
  };
  db.matches.push(m);
  save();
  openMatch(m.id);
});

// ---------- match view ----------
function openMatch(id) {
  current = db.matches.find((m) => m.id === id);
  if (!current) return show("home");
  show("match");
  renderMatch();
  if (current.status === "live") { tick = setInterval(renderClock, 250); requestWake(); }
}

function renderMatch() {
  const m = current;
  $("mDate").textContent = localDate(when(m)) + (m.startedAt ? " " + localTime(m.startedAt).slice(0, 5) : "");
  if (document.activeElement !== $("inNote")) $("inNote").value = m.note || "";
  $("nUs").textContent = $("gUsName").textContent = m.ourTeam;
  $("nThem").textContent = $("gThemName").textContent = m.opponent;
  $("sUs").textContent = score(m, "us");
  $("sThem").textContent = score(m, "them");
  const live = m.status === "live";
  $("liveControls").classList.toggle("hidden", !live);
  $("readyControls").classList.toggle("hidden", m.status !== "ready");
  $("readyInfo").textContent = `${m.periods} × ${m.periodMinutes} min`;
  $("btnDelete").classList.toggle("hidden", live);
  if (live) {
    const lastPeriod = m.period >= m.periods;
    $("btnPeriod").textContent = m.between ? `Start ${periodName(m, m.period)}`
      : lastPeriod ? "Final whistle" : `End ${periodName(m, m.period)}`;
    $("btnPause").disabled = m.between || periodMs(m) >= periodLen(m);
    $("btnPause").textContent = m.clock.runningSince ? "Pause" : "Resume";
    $("goalUs").disabled = $("goalThem").disabled = m.between;
    renderClock();
  }
  const log = $("goalLog");
  log.innerHTML = "";
  if (!m.goals.length) log.innerHTML = '<li class="muted">No goals yet.</li>';
  let us = 0, them = 0;
  m.goals.forEach((g, i) => {
    g.team === "us" ? us++ : them++;
    const li = document.createElement("li");
    li.innerHTML = `<span class="dot" style="background:var(--${g.team})"></span>
      <span class="t">${periodName(m, g.period)} ${fmt(g.periodMs)}</span>
      <span class="who"></span><span class="muted">${us}–${them}</span>
      <button class="x" aria-label="Delete goal">×</button>`;
    li.querySelector(".who").textContent = g.team === "us" ? m.ourTeam : m.opponent;
    li.querySelector(".x").addEventListener("click", () => {
      if (!confirm(`Delete goal at ${periodName(m, g.period)} ${fmt(g.periodMs)}?`)) return;
      m.goals.splice(i, 1); save(); renderMatch();
    });
    log.prepend(li); // newest on top
  });
}

function renderClock() {
  const m = current;
  if (!m || m.status !== "live") return;
  const ms = periodMs(m);
  // Clock stops by itself when the period runs out (also if the app was closed meanwhile).
  if (m.clock.runningSince && ms >= periodLen(m)) {
    m.clock = { acc: periodLen(m), runningSince: null };
    save();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    return renderMatch();
  }
  const c = $("clock");
  c.textContent = fmt(Math.ceil((periodLen(m) - ms) / 1000) * 1000); // count down
  c.classList.toggle("paused", !m.clock.runningSince);
  c.classList.toggle("over", ms >= periodLen(m));
  $("periodLabel").textContent = m.between
    ? `Break after ${periodName(m, m.period - 1)}`
    : `Period ${m.period} of ${m.periods}` + (periodMs(m) >= periodLen(m) ? " · time is up" : m.clock.runningSince ? "" : " · paused");
}

function addGoal(team) {
  const m = current;
  if (!m || m.status !== "live" || m.between) return;
  m.goals.push({ team, period: m.period, periodMs: periodMs(m), matchMs: matchMs(m) });
  save();
  if (navigator.vibrate) navigator.vibrate(60);
  toast(`Goal ${team === "us" ? m.ourTeam : m.opponent} · ${periodName(m, m.period)} ${fmt(periodMs(m))}`);
  renderMatch();
}
$("goalUs").addEventListener("click", () => addGoal("us"));
$("goalThem").addEventListener("click", () => addGoal("them"));

$("btnPause").addEventListener("click", () => {
  const c = current.clock;
  if (periodMs(current) >= periodLen(current)) return toast("Period time is up");
  if (c.runningSince) { c.acc += Date.now() - c.runningSince; c.runningSince = null; }
  else c.runningSince = Date.now();
  save(); renderMatch();
});

$("btnPeriod").addEventListener("click", () => {
  const m = current;
  if (m.between) { // start next period
    m.between = false;
    m.clock = { acc: 0, runningSince: Date.now() };
  } else if (m.period >= m.periods) {
    if (!confirm("End the match?")) return;
    return endMatch(m, true);
  } else { // end this period
    m.periodDurations.push(periodMs(m));
    m.clock = { acc: 0, runningSince: null };
    m.period++;
    m.between = true;
  }
  save(); renderMatch();
});

$("btnStart").addEventListener("click", () => {
  const m = current;
  const now = Date.now();
  m.startedAt = new Date(now).toISOString();
  m.status = "live";
  m.clock = { acc: 0, runningSince: now };
  save();
  openMatch(m.id);
});

// Everything is already saved as you go; this button is just a clear way back to the list.
$("btnSaveExit").addEventListener("click", () => { save(); toast("Saved"); show("home"); });

$("inNote").addEventListener("input", () => { current.note = $("inNote").value; save(); });

$("btnEnd").addEventListener("click", () => {
  if (confirm("End the match now?")) endMatch(current, true);
});

function endMatch(m, rerender) {
  if (!m.between) m.periodDurations.push(periodMs(m));
  m.clock = { acc: 0, runningSince: null };
  m.status = "done";
  m.endedAt = new Date().toISOString();
  save();
  if (rerender) { clearInterval(tick); releaseWake(); renderMatch(); }
}

$("btnDelete").addEventListener("click", () => {
  if (!confirm(`Delete the match vs ${current.opponent}? This can't be undone.`)) return;
  db.matches = db.matches.filter((m) => m !== current);
  save(); show("home");
});

// ---------- analysis ----------
let aMatches = []; // started matches, oldest first
let binSize = 1;    // minutes per column
let cumulative = false; // running total over the match instead of goals per interval

$("aMode").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  cumulative = b.dataset.mode === "cum";
  for (const x of $("aMode").children) x.classList.toggle("on", x === b);
  $("binWrap").classList.toggle("hidden", cumulative);
  renderAnalysis();
});

$("binSize").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  binSize = +b.dataset.size;
  for (const x of $("binSize").children) x.classList.toggle("on", x === b);
  renderAnalysis();
});

$("btnAnalysis").addEventListener("click", () => {
  aMatches = db.matches.filter((m) => m.startedAt).sort((a, b) => a.startedAt.localeCompare(b.startedAt));
  show("analysis");
  const n = aMatches.length;
  $("aCharts").classList.toggle("hidden", !n);
  if (!n) { $("aSummary").textContent = "No matches played yet."; return; }
  for (const r of [$("rFrom"), $("rTo")]) { r.max = n - 1; r.disabled = n < 2; }
  $("rFrom").value = 0; $("rTo").value = n - 1; // start with all matches
  renderAnalysis();
});
for (const id of ["rFrom", "rTo"]) $(id).addEventListener("input", () => {
  // keep the two handles from crossing
  const f = $("rFrom"), t = $("rTo");
  if (+f.value > +t.value) (id === "rFrom" ? t : f).value = $(id).value;
  renderAnalysis();
});
window.addEventListener("resize", () => { if (!$("analysis").classList.contains("hidden") && aMatches.length) renderAnalysis(); });

function renderAnalysis() {
  const from = +$("rFrom").value, to = +$("rTo").value, n = aMatches.length;
  const sel = aMatches.slice(from, to + 1);
  const label = (m) => `${localDate(m.startedAt)}<br><span class="muted"></span>`;
  for (const [el, m] of [[$("lFrom"), sel[0]], [$("lTo"), sel[sel.length - 1]]]) {
    el.innerHTML = label(m); el.querySelector("span").textContent = "vs " + m.opponent;
  }
  const pct = (i) => (n < 2 ? 0 : (i / (n - 1)) * 100);
  $("rangeFill").style.left = pct(from) + "%";
  $("rangeFill").style.width = (pct(to) - pct(from)) + "%";

  // One column per binSize minutes of each period; periods/length taken from the selected matches.
  const periods = Math.max(3, ...sel.map((m) => m.periods));
  const minutes = Math.max(...sel.map((m) => m.periodMinutes));
  const size = cumulative ? 1 : binSize; // cumulative always uses 1-minute steps
  const nBins = Math.ceil(minutes / size);
  const bins = { us: [], them: [] };
  for (const t in bins) for (let p = 0; p < periods; p++) bins[t].push(new Array(nBins).fill(0));
  let tot = { us: 0, them: 0 };
  for (const m of sel) for (const g of m.goals) {
    const min = Math.min(minutes - 1, Math.floor(g.periodMs / 60000));
    bins[g.team][g.period - 1][Math.floor(min / size)]++;
    tot[g.team]++;
  }
  if (cumulative) for (const t in bins) {
    // running total through the whole match, carrying over from one period to the next
    let run = 0;
    for (const row of bins[t]) for (let i = 0; i < row.length; i++) row[i] = run += row[i];
  }
  $("aSummary").textContent = `${sel.length} match${sel.length === 1 ? "" : "es"} · scored ${tot.us} · conceded ${tot.them}`;
  const avg = (t) => bins[t].map((row) => row.map((c) => c / sel.length));
  const a = { us: avg("us"), them: avg("them") };
  // Shared y scale so the two charts can be compared directly.
  const max = Math.max(0, ...a.us.flat(), ...a.them.flat());
  const yMax = niceMax(max);
  document.querySelectorAll(".binLabel").forEach((e) => (e.textContent = cumulative ? "avg per match, running total" : binSize === 1 ? "avg per match, per minute" : `avg per match, per ${binSize} min`));
  drawHist($("chartUs"), a.us, bins.us, "var(--us)", yMax, sel.length, minutes);
  drawHist($("chartThem"), a.them, bins.them, "var(--them)", yMax, sel.length, minutes);
}

function niceMax(v) {
  if (v <= 0) return 1;
  for (const step of [0.1, 0.2, 0.25, 0.5, 1, 2, 5]) if (v <= step * 4) return Math.ceil(v / step) * step;
  return Math.ceil(v);
}

function drawHist(box, avg, counts, color, yMax, nMatches, minutes) {
  const W = box.clientWidth || 320, H = 180, L = 30, R = 2, T = 8, B = 22, gapP = 8;
  const P = avg.length, M = avg[0].length;
  const colW = (W - L - R - gapP * (P - 1)) / (P * M);
  const y = (v) => T + (H - T - B) * (1 - v / yMax);
  const fmtN = (v) => (Math.round(v * 100) / 100).toString();
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (const v of [0, yMax / 2, yMax]) {
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text class="axis" x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${fmtN(v)}</text>`;
  }
  const cols = [];
  for (let p = 0; p < P; p++) {
    const x0 = L + p * (M * colW + gapP);
    svg += `<text class="axis" x="${x0 + (M * colW) / 2}" y="${H - 6}" text-anchor="middle">P${p + 1}</text>`;
    for (let i = 0; i < M; i++) {
      const v = avg[p][i], x = x0 + i * colW, w = Math.max(1, colW - 2);
      if (v > 0) {
        const top = y(v), base = y(0), r = Math.min(4, w / 2, base - top);
        svg += `<path fill="${color}" d="M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${base}Z"/>`;
      }
      cols.push({ x, w: colW, p, i, v, c: counts[p][i] });
    }
  }
  svg += `</svg><div class="tip hidden"></div>`;
  box.innerHTML = svg;

  // Tap / hover a column to see its numbers.
  const tip = box.querySelector(".tip"), el = box.querySelector("svg");
  const pick = (e) => {
    const rect = el.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const col = cols.find((c) => px >= c.x && px < c.x + c.w + (c.i === M - 1 ? gapP : 0));
    if (!col) return tip.classList.add("hidden");
    const end = Math.min(minutes, (col.i + 1) * (cumulative ? 1 : binSize));
    tip.innerHTML = cumulative
      ? `<b>By P${col.p + 1} · ${end} min</b><br>${fmtN(col.v)} per match · ${col.c} goal${col.c === 1 ? "" : "s"} in ${nMatches}`
      : `<b>P${col.p + 1} · ${col.i * binSize}–${end} min</b><br>${fmtN(col.v)} per match · ${col.c} goal${col.c === 1 ? "" : "s"} in ${nMatches}`;
    tip.classList.remove("hidden");
    const left = ((col.x + col.w / 2) / W) * rect.width;
    tip.style.left = Math.min(rect.width - tip.offsetWidth / 2, Math.max(tip.offsetWidth / 2, left)) + "px";
  };
  el.addEventListener("pointerdown", pick);
  el.addEventListener("pointermove", pick);
  el.addEventListener("pointerleave", () => tip.classList.add("hidden"));
}

// ---------- CSV export ----------
function csvCell(v) { v = v == null ? "" : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function buildCsv() {
  const head = ["match_id", "date", "start_time", "our_team", "opponent", "status",
    "goal_no", "team", "period", "period_time", "clock_remaining", "match_time", "score_us", "score_them", "note"];
  const rows = [head];
  const ms = [...db.matches].sort((a, b) => when(a).localeCompare(when(b)));
  for (const m of ms) {
    const base = [m.id, localDate(when(m)), m.startedAt ? localTime(m.startedAt) : "", m.ourTeam, m.opponent, m.status];
    if (!m.goals.length) rows.push([...base, "", "", "", "", "", "", 0, 0, m.note]);
    let us = 0, them = 0;
    m.goals.forEach((g, i) => {
      g.team === "us" ? us++ : them++;
      rows.push([...base, i + 1, g.team === "us" ? m.ourTeam : m.opponent, g.period, fmt(g.periodMs), fmt(Math.ceil((m.periodMinutes * 60000 - g.periodMs) / 1000) * 1000), fmt(g.matchMs), us, them, m.note]);
    });
  }
  return rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
}

$("btnExport").addEventListener("click", async () => {
  if (!db.matches.length) return toast("Nothing to export yet");
  const name = `hockeystats-${localDate(new Date().toISOString())}.csv`;
  const blob = new Blob(["﻿" + buildCsv()], { type: "text/csv" });
  const file = new File([blob], name, { type: "text/csv" });
  // Share sheet works best from a home-screen app (save to Files, Drive, mail...). Fall back to a download.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

// ---------- misc ----------
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// Keep the screen on during a live match (where supported).
let wake = null;
async function requestWake() { try { wake = await navigator.wakeLock.request("screen"); } catch {} }
function releaseWake() { if (wake) { wake.release(); wake = null; } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && current && current.status === "live") { requestWake(); renderClock(); }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// Jump straight back into a running match when the app is reopened.
const liveMatch = db.matches.find((m) => m.status === "live");
liveMatch ? openMatch(liveMatch.id) : show("home");
</script>
